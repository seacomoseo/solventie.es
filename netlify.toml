[build]
publish = "public"
command = "sh do hugo"

[build.environment]
HUGO_VERSION = "0.164.0"
NODE_VERSION = "22.22.2"

[context.production]
publish = "public"
command = "sh do hugo"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"

# Landing-only native proxies. Keep the shared site transport below unchanged.
[[redirects]]
  from = "/api/forms/acatcor"
  to = "https://solvent-acatcor-intake.seacomoseo.workers.dev/v1/forms"
  status = 200
  force = true

# Reconcile already-open landing tabs without changing any other form route.
[[redirects]]
  from = "/api/forms"
  to = "https://solvent-acatcor-intake.seacomoseo.workers.dev/v1/forms"
  status = 200
  force = true
  query = {route = "principal:solventie.es:form-jornada-tecnica-comunidades-de-regantes"}

# Existing shared site transport (outside this landing change).
[[redirects]]
  from = "/api/forms"
  to = "https://sansoul-forms.sansoul.workers.dev/v1/forms"
  status = 200
  force = true
